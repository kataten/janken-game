<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>じゃんけん中...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>最初はグー！</h1>
    <h2>じゃんけん...</h2>

    <div class="hand-group">
        <button class="hand-btn" onclick="play(0)">
            <img src="/static/rock.png" alt="グー">
        </button>
        <button class="hand-btn" onclick="play(1)">
            <img src="/static/scissors.png" alt="チョキ">
        </button>
        <button class="hand-btn" onclick="play(2)">
            <img src="/static/paper.png" alt="パー">
        </button>
    </div>

    <script>

            // ページ読み込み時にログインチェック
        if (!localStorage.getItem('player_id')) {
            alert("ログインが必要です");
            window.location.href = "/";
        }
        
        async function play(hand) {
            const playerId = localStorage.getItem('player_id');
            // APIを叩く
            const response = await fetch(`/janken/${playerId}/${hand}`);
            const data = await response.json();
            
            // 結果を一時保存して結果画面へ
            localStorage.setItem('last_result', JSON.stringify(data));
            window.location.href = "/result_page";
        }
    </script>
</body>
</html>
