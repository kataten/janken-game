<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>じゃんけん結果 - ゲーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container-box"> <h1>対戦結果</h1>

        <div class="hands-container">
            <div>
                <div class="hand-label">あなた</div>
                <div class="hand-icon">
                    <img id="player-hand-img" src="" alt="" class="hand-image">
                </div>
            </div>
            <div class="vs">VS</div>
            <div>
                <div class="hand-label">CPU</div>
                <div class="hand-icon">
                    <img id="cpu-hand-img" src="" alt="" class="hand-image">
                </div>
            </div>
        </div>

        <div id="judgment-text" class="judgment">判定中...</div>

        <div class="result-actions">
            <button class="btn btn-main" onclick="location.href='/select'">もう一度遊ぶ</button>

            <div class="sub-actions">
                <button class="btn btn-sub" onclick="location.href='/history_page'">成績を見る</button>
                <button class="btn btn-logout" onclick="location.href='/top'">トップへ</button>
            </div>
        </div>
    </div>

    <script>
        // ログインチェック
        if (!localStorage.getItem('player_id')) {
            window.location.href = "/";
        }
        
        const resultData = JSON.parse(localStorage.getItem('last_result'));

        if (resultData) {
            const imagePaths = {
                0: "/static/rock.png",
                1: "/static/scissors.png",
                2: "/static/paper.png"
            };
            const messages = {0: "あいこ！", 1: "あなたの負け...", 2: "あなたの勝ち！"};

            document.getElementById('player-hand-img').src = imagePaths[resultData.player];
            document.getElementById('cpu-hand-img').src = imagePaths[resultData.cpu];
            
            const jText = document.getElementById('judgment-text');
            jText.innerText = messages[resultData.result];
            
            // 色の演出
            if (resultData.result === 2) jText.style.color = "#e91e63"; // 勝ち：ピンク赤
            if (resultData.result === 0) jText.style.color = "#777";    // あいこ：グレー
        } else {
            window.location.href = "/select";
        }
    </script>
</body>
</html>
