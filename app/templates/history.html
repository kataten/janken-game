<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>対戦成績 - じゃんけんゲーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>あなたの対戦成績</h1>

    <div class="stats-card">
        <div>現在の勝率</div>
        <div id="win-rate" class="win-rate">--%</div>
        <div id="total-games">合計: --戦</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>日時</th>
                <th>あなた</th>
                <th>CPU</th>
                <th>結果</th>
            </tr>
        </thead>
        <tbody id="history-table">
            </tbody>
    </table>

    <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
        <button class="btn" onclick="location.href='/top'" style="background-color: #777; color: white;">トップへ戻る</button>
        
        <button class="btn" onclick="location.href='/select'" style="background-color: #ff9800; color: white; font-weight: bold;">
            じゃんけんをする
        </button>
    </div>

    <div style="margin-top: 20px;">
    <button id="prev-btn" class="btn" onclick="changePage(-1)">◀ 前の10件</button>
    <span id="page-info" style="margin: 0 15px;">1 / 1 ページ</span>
    <button id="next-btn" class="btn" onclick="changePage(1)">次の10件 ▶</button>
</div>

<script>
    // ページ読み込み時にログインチェック
        if (!localStorage.getItem('player_id')) {
            alert("ログインが必要です");
            window.location.href = "/";
        }
    let currentPage = 1;

    async function loadHistory(page = 1) {
        const playerId = localStorage.getItem('player_id');
        
        // APIにpageパラメータを渡す
        const response = await fetch(`/history/${playerId}?page=${page}`);
        const data = await response.json();

        // 勝率などの表示
        document.getElementById('win-rate').innerText = data.win_rate;
        document.getElementById('total-games').innerText = `合計: ${data.total_games}戦`;
        document.getElementById('page-info').innerText = `${data.current_page} / ${data.total_pages} ページ`;
        currentPage = data.current_page;

        // ボタンの有効・無効切り替え
        document.getElementById('prev-btn').disabled = (currentPage === 1);
        document.getElementById('next-btn').disabled = (currentPage >= data.total_pages);

        // テーブルの描画（一度空にする）
        const tableBody = document.getElementById('history-table');
        tableBody.innerHTML = ""; 
        
        data.history.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.date}</td>
                <td>${item.player_hand}</td>
                <td>${item.cpu_hand}</td>
                <td class="${item.result === '勝ち' ? 'result-win' : ''}">${item.result}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    function changePage(step) {
        loadHistory(currentPage + step);
    }

    // 初回読み込み
    loadHistory(1);
</script>
</body>
</html>
