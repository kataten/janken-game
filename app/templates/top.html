<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>じゃんけんゲーム - トップ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-box">
        <h1 id="welcome-msg">こんにちは！</h1>
        
        <button class="btn" onclick="location.href='/select'">じゃんけんをする</button>
        <br>
        <button class="btn" onclick="location.href='/history_page'">集計を見る</button>
        <button class="btn btn-logout" onclick="logout()">ログアウト</button>
        
        </div>

    <div id="logout-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>ログアウトしますか？</h3>
            <p style="color:#666; font-size:14px;">また遊びに来てくださいね！</p>
            <div class="modal-btns">
                <button class="btn" onclick="closeLogoutModal()" style="background:#eee; color:#333; flex:1;">戻る</button>
                <button class="btn" onclick="executeLogout()" style="background:#f44336; color:white; flex:1;">ログアウト</button>
            </div>
        </div>
    </div>

    <script>
        // ログイン時に保存した名前を表示
        const name = localStorage.getItem('player_name');
        if (name) {
            document.getElementById('welcome-msg').innerText = `こんにちは、${name}さん！`;
        } else {
            // ログインしてなければ戻す
            window.location.href = "/";
        }

        // ログアウトボタンが押されたとき
        function logout() {
            document.getElementById('logout-modal').style.display = 'flex';
        }

        // キャンセルボタン
        function closeLogoutModal() {
            document.getElementById('logout-modal').style.display = 'none';
        }

        // 本当にログアウトするとき
        function executeLogout() {
            localStorage.removeItem('player_id');
            localStorage.removeItem('player_name');
            window.location.href = "/";
        }
    </script>
</body>
</html>
