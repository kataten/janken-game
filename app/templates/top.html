<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>じゃんけんゲーム - トップ</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding-top: 100px; }
        .btn { padding: 20px 40px; font-size: 20px; cursor: pointer; margin: 10px; }
    </style>
</head>
<body>
    <h1 id="welcome-msg">こんにちは！</h1>
    
    <button class="btn" onclick="location.href='/select'">じゃんけんをする</button>
    <br>
    <button class="btn" onclick="location.href='/history_page'">集計を見る</button>
    <button class="btn" style="background-color: #f44336; color: white;" onclick="logout()">ログアウト</button>

    <script>
        // ログイン時に保存した名前を表示
        const name = localStorage.getItem('player_name');
        if (name) {
            document.getElementById('welcome-msg').innerText = `こんにちは、${name}さん！`;
        } else {
            // ログインしてなければ戻す
            window.location.href = "/";
        }

        function logout() {
        if (confirm("ログアウトしますか？")) {
            // 1. ブラウザに保存したデータを消去
            localStorage.removeItem('player_id');
            localStorage.removeItem('player_name');
            
            // 2. ログイン画面へ戻す
            window.location.href = "/";
        }
    }
    </script>
</body>
</html>
